name: Validate Voidfox overlay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python
        run: python -m py_compile scripts/apply_voidfox.py
      - name: Validate JSON
        run: |
          python -m json.tool voidfox.json >/dev/null
          python -m json.tool overlay/mobile/android/fenix/app/src/main/assets/extensions/gx-archive-downloader/manifest.json >/dev/null
      - name: Validate JavaScript
        run: |
          node --check overlay/mobile/android/fenix/app/src/main/assets/extensions/gx-archive-downloader/background.js
          node --check overlay/mobile/android/fenix/app/src/main/assets/extensions/gx-archive-downloader/content.js
          node --check vendor/gx-mod-downloader/gx-archive-downloader.user.js
